{{- $app := .Values.application | default dict }}
{{- $auth := $app.auth | default dict }}
{{- $create := $auth.secrets | default dict }}
{{- if $create.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-application" (include "travorse.fullname" .)) $create.name }}
  labels:
    {{- include "travorse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $create.authSecretValue }}
  {{ default "auth-secret" ($auth.authSecret.secretKey | default "auth-secret") }}: {{ . | quote }}
  {{- end }}
  {{- with $create.clientSecretValue }}
  {{ default "oidc-client-secret" ($auth.clientSecret.secretKey | default "oidc-client-secret") }}: {{ . | quote }}
  {{- end }}
{{- end }}
